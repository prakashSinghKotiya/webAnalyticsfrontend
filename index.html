<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WebPulse — TTFB, Lighthouse, uptime, DNS and WHOIS monitoring from probe locations worldwide." />
    <meta name="theme-color" content="#171717" />
    <title>WebPulse — Web Performance &amp; Monitoring</title>
    <script>
      // Apply the persisted theme BEFORE first paint (prevents flash of the
      // wrong theme). ThemeContext takes over once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('wp-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
